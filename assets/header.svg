<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-label="Sarthak Zende, AI Engineer, Software Engineer, Data and Analytics">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#06B6D4;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#8B5CF6;#06B6D4" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="1000" height="260" rx="14"/>
    </clipPath>
    <style>
      .name {
        font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
        font-size: 66px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .line {
        font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
        font-size: 21px;
        font-weight: 600;
        fill: #a9b1d6;
        opacity: 0;
        animation: cycle 12s linear infinite;
      }
      .l2 { animation-delay: 3s; }
      .l3 { animation-delay: 6s; }
      .l4 { animation-delay: 9s; }
      @keyframes cycle {
        0% { opacity: 0; }
        4% { opacity: 1; }
        22% { opacity: 1; }
        26% { opacity: 0; }
        100% { opacity: 0; }
      }
      .spark { fill: #06B6D4; animation: pulse 3s ease-in-out infinite; }
      .spark2 { fill: #8B5CF6; animation-delay: 1.5s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="260" rx="14" fill="#1a1b27"/>
  <rect width="1000" height="260" rx="14" fill="url(#glow)"/>

  <g clip-path="url(#clip)">
    <text class="spark" x="120" y="82" font-size="26">✦</text>
    <text class="spark spark2" x="862" y="70" font-size="20">✦</text>
    <text class="spark spark2" x="200" y="188" font-size="14">✦</text>
    <text class="spark" x="798" y="192" font-size="15">✦</text>

    <text class="name" x="500" y="122" text-anchor="middle" fill="url(#accent)">Sarthak Zende</text>

    <text class="line" x="500" y="166" text-anchor="middle">Software Engineer @ Stealth AI Startup</text>
    <text class="line l2" x="500" y="166" text-anchor="middle">Building LLM Apps &amp; Agentic Workflows</text>
    <text class="line l3" x="500" y="166" text-anchor="middle">LangGraph · RAG Pipelines · MCP Tools</text>
    <text class="line l4" x="500" y="166" text-anchor="middle">Data Engineering on AWS &amp; Azure</text>

    <g opacity="0.45">
      <g>
        <path d="M0 224 Q 250 204 500 224 T 1000 224 T 1500 224 T 2000 224 V 260 H 0 Z" fill="url(#accent)"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
      </g>
    </g>
    <g opacity="0.85">
      <g>
        <path d="M0 236 Q 250 216 500 236 T 1000 236 T 1500 236 T 2000 236 V 260 H 0 Z" fill="url(#accent)"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
