<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#8B5CF6;#06B6D4" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#06B6D4;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1000" height="120" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1000" height="120" rx="14" fill="#1a1b27"/>

  <g clip-path="url(#clip)">
    <text x="500" y="46" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#a9b1d6">Thanks for stopping by ✦</text>

    <g opacity="0.45">
      <g>
        <path d="M0 84 Q 250 66 500 84 T 1000 84 T 1500 84 T 2000 84 V 120 H 0 Z" fill="url(#accent)"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
      </g>
    </g>
    <g opacity="0.85">
      <g>
        <path d="M0 96 Q 250 78 500 96 T 1000 96 T 1500 96 T 2000 96 V 120 H 0 Z" fill="url(#accent)"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
